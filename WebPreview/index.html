<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>投資袋著走</title>
<style>
/* Layout: one phone-width column (max 440px), a translucent sticky header, a scrolling body and a floating
   translucent tab bar that lets the page show through. Light and dark themes share the tokens below. */
:root {
  --bg: #edf2ff; --bg-soft: #f6f8ff; --app-top: #e1ebff; --card: #ffffff; --card-2: #f3f6ff; --field: #ffffff;
  --ink: #0f1f3d; --muted: #66748f; --line: rgba(15,31,61,.09);
  --blue: #1f6bff; --blue-deep: #1450e6; --red: #e3363b; --green: #0b9a68; --orange: #f58c0f; --pink: #e94b80; --purple: #7a52f2; --teal: #12b3c4; --yellow: #f7b500;
  --hero: linear-gradient(135deg, #4592ff 0%, #1453ec 100%);
  --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
  --num: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "PingFang TC", "Segoe UI", sans-serif;
  --radius: 20px; --shadow: 0 6px 20px rgba(31,107,255,.08);
  --glass: rgba(255,255,255,.55); --glass-top: rgba(255,255,255,.78); --glass-line: rgba(255,255,255,.8); --glass-hi: rgba(255,255,255,.9); --glass-pill: rgba(255,255,255,.5); --head-bg: rgba(246,248,255,.78);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="system"] {
    --bg: #0b1222; --bg-soft: #0e1628; --app-top: #13213f; --card: #17213a; --card-2: #1d2945; --field: #1b2742;
    --ink: #e9eefb; --muted: #97a3bd; --line: rgba(233,238,251,.1);
    --shadow: 0 6px 18px rgba(0,0,0,.28); --glass: rgba(23,33,58,.55); --glass-top: rgba(40,54,88,.7); --glass-line: rgba(255,255,255,.12); --glass-hi: rgba(255,255,255,.18); --glass-pill: rgba(255,255,255,.12); --head-bg: rgba(14,22,40,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1222; --bg-soft: #0e1628; --app-top: #13213f; --card: #17213a; --card-2: #1d2945; --field: #1b2742;
  --ink: #e9eefb; --muted: #97a3bd; --line: rgba(233,238,251,.1);
  --shadow: 0 6px 18px rgba(0,0,0,.28); --glass: rgba(23,33,58,.55); --glass-top: rgba(40,54,88,.7); --glass-line: rgba(255,255,255,.12); --glass-hi: rgba(255,255,255,.18); --glass-pill: rgba(255,255,255,.12); --head-bg: rgba(14,22,40,.8);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg-soft); }
body { margin: 0; background: var(--bg-soft); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
input, select, textarea { font: inherit; font-size: 16px; color: var(--ink); }
a { color: var(--blue); }
.app { max-width: 440px; margin: 0 auto; min-height: 100vh; background: linear-gradient(180deg, var(--app-top) 0%, var(--bg-soft) 420px); }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.tiny { font-size: 11px; }
.bold { font-weight: 700; }
.blue { color: var(--blue); }
/* The approved mock-up shows gains in green and losses in red. */
.up { color: var(--green); } .down { color: var(--red); } .flat { color: var(--muted); }
.hero .up { color: #b8f5cb; } .hero .down { color: #ffd0d3; }
.hero .hero-tile .up { color: var(--green); } .hero .hero-tile .down { color: var(--red); }
.art { display: block; object-fit: contain; }
.bell-wrap { position: relative; }
.bell-wrap .dot { position: absolute; top: 8px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px var(--bg-soft); }

/* Header */
.head { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; min-height: 54px; padding: env(safe-area-inset-top, 0px) 6px 0; background: var(--head-bg); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); }
.head.wide-right { grid-template-columns: 52px 1fr auto; }
.head .ttl { text-align: center; min-width: 0; padding: 6px 0; }
.head h1 { margin: 0; font-size: 18px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head .sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head .right { display: flex; gap: 0; justify-content: flex-end; }
.head .text-btn { color: var(--blue); font-weight: 700; padding: 8px 10px; }
.head .live-link { align-self: center; margin-right: 2px; padding: 6px 10px; border-radius: 99px; color: var(--blue); background: color-mix(in srgb, var(--blue) 11%, transparent); font-size: 13px; font-weight: 800; white-space: nowrap; text-decoration: none; }
.about-src .note { margin-top: 6px; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--ink); }
.icon-btn:active { background: var(--line); }
.icon-btn svg { width: 22px; height: 22px; }
.page-top { display: flex; align-items: flex-start; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) 0 2px; }
.page-top h1 { margin: 0; font-size: 24px; font-weight: 900; letter-spacing: .5px; }
.page-top .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.body { padding: 6px 16px calc(112px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
.body.with-bar { padding-bottom: calc(176px + env(safe-area-inset-bottom, 0px)); }

/* Floating "liquid glass" tab bar, modelled on iOS 26: the page shows through, a glass bubble slides to the
   selected tab (stretching as it moves), icons bounce, and scrolling down shrinks the bar to the current tab. */
.tabbar { position: fixed; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; justify-content: center; padding: 0 12px; pointer-events: none; transition: padding .45s cubic-bezier(.32,.72,0,1); }
.tabbar .inner { position: relative; pointer-events: auto; display: flex; width: 100%; max-width: 416px; padding: 7px 4px 6px; border-radius: 30px;
  background: linear-gradient(180deg, var(--glass-top), var(--glass)); border: 1px solid var(--glass-line);
  backdrop-filter: blur(22px) saturate(1.9) brightness(1.04); -webkit-backdrop-filter: blur(22px) saturate(1.9) brightness(1.04);
  box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 rgba(255,255,255,.12), 0 12px 32px rgba(20,40,90,.18);
  transition: max-width .5s cubic-bezier(.32,.72,0,1), padding .5s cubic-bezier(.32,.72,0,1), border-radius .5s; }
/* Round glass lens around the selected orb; while switching it flows like a droplet from the old orb to the new one. */
.tab-indicator { position: absolute; top: -4px; left: 0; width: 56px; height: 56px; border-radius: 28px; pointer-events: none;
  background: radial-gradient(circle at 50% 28%, rgba(255,255,255,.55), var(--glass-pill) 62%);
  box-shadow: inset 0 0 0 1.5px var(--glass-hi), inset 0 -7px 12px rgba(31,107,255,.14), inset 0 4px 6px rgba(255,255,255,.5), 0 8px 20px rgba(31,107,255,.22);
  backdrop-filter: blur(3px) saturate(2.3) brightness(1.08); -webkit-backdrop-filter: blur(3px) saturate(2.3) brightness(1.08);
  transition: left .42s cubic-bezier(.3,1.35,.5,1), width .42s cubic-bezier(.3,1.35,.5,1), height .3s ease, top .3s ease, opacity .3s; }
.tab-indicator.flowing { height: 48px; top: 0; transition: left .2s cubic-bezier(.4,0,.6,1), width .2s cubic-bezier(.4,0,.6,1), height .2s ease, top .2s ease; }
.tab { position: relative; z-index: 1; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--ink); transition: flex .5s cubic-bezier(.32,.72,0,1), opacity .3s; }
/* Each coloured icon is a glossy glass orb: specular highlight on top, light rim, darker inner edge below. */
.tab .ball { position: relative; overflow: hidden; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; transition: transform .35s cubic-bezier(.34,1.56,.64,1); }
.tab .ball::before { content: ""; position: absolute; left: 17%; right: 17%; top: 5%; height: 40%; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,0)); pointer-events: none; }
.tab .ball::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.45), inset 0 -5px 9px rgba(0,0,0,.16); pointer-events: none; }
.tab .ball svg { position: relative; z-index: 1; width: 21px; height: 21px; stroke-width: 2.3; filter: drop-shadow(0 1px 1px rgba(0,0,0,.18)); }
.tab .lbl { white-space: nowrap; transition: opacity .25s, max-height .4s; max-height: 16px; }
.tab.on .ball { transform: translateY(-3px) scale(1.12); }
.tab:active .ball { transform: scale(.84); }
.tab.on:active .ball { transform: translateY(-2px) scale(1.02); }
.tab.pop .ball svg { animation: icon-bounce .6s cubic-bezier(.34,1.56,.64,1); }
@keyframes icon-bounce { 0% { transform: scale(1); } 30% { transform: scale(.72) rotate(-8deg); } 60% { transform: scale(1.18) rotate(4deg); } 100% { transform: scale(1); } }
.tab.on { font-weight: 900; }
.tab:not(.on) .ball { filter: saturate(.9); }
.tabbar.mini { padding-left: 16px; justify-content: flex-start; }
.tabbar.mini .inner { max-width: 62px; padding: 6px; border-radius: 31px; }
.tabbar.mini .tab:not(.on) { flex: 0 0 0; opacity: 0; pointer-events: none; overflow: hidden; }
.tabbar.mini .tab .lbl { opacity: 0; max-height: 0; }
.tabbar.mini .tab.on .ball { transform: none; }
.tabbar.mini .tab-indicator { opacity: 0; }
.actionbar { position: fixed; left: 0; right: 0; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 15; display: flex; justify-content: center; padding: 8px 16px; }
.actionbar .inner { display: flex; gap: 12px; width: 100%; max-width: 408px; }

/* Surfaces */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.card.tight { padding: 6px 14px; }
.card.flat { box-shadow: none; background: var(--card-2); }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.top { align-items: flex-start; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.divider { height: 1px; background: var(--line); }
.section-title { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 800; margin: 0; }
.section-title::before { content: ""; width: 4px; height: 17px; border-radius: 4px; background: var(--blue); flex: none; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.link { color: var(--blue); font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 2px; }
.link svg { width: 14px; height: 14px; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.banner { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: color-mix(in srgb, var(--blue) 10%, var(--card)); color: var(--blue-deep); font-size: 13px; }
.banner .grow { color: var(--ink); }
.banner button { color: var(--blue); font-weight: 800; white-space: nowrap; }
.banner svg { width: 20px; height: 20px; flex: none; }
.banner.warn { background: color-mix(in srgb, var(--orange) 13%, var(--card)); color: var(--orange); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 0 16px; border-radius: 14px; font-weight: 800; font-size: 15px; }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--hero); color: #fff; box-shadow: 0 8px 18px rgba(31,107,255,.28); }
.btn.outline { background: var(--card); color: var(--blue); border: 1.5px solid var(--blue); }
.btn.soft { background: color-mix(in srgb, var(--blue) 10%, var(--card)); color: var(--blue); }
.btn.danger { background: color-mix(in srgb, var(--red) 10%, var(--card)); color: var(--red); border: 1.5px solid color-mix(in srgb, var(--red) 45%, transparent); }
.btn.ghost { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13px; border-radius: 12px; }
.btn.block { width: 100%; }
.btn-row { display: flex; gap: 12px; }
.btn-row > * { flex: 1; }
.btn:disabled, button:disabled { opacity: .45; cursor: default; }
.btn:active { transform: scale(.98); }
.pill-btn { display: inline-flex; align-items: center; gap: 4px; padding: 7px 13px; border-radius: 99px; background: var(--hero); color: #fff; font-weight: 800; font-size: 13px; box-shadow: 0 6px 14px rgba(31,107,255,.28); white-space: nowrap; }
.pill-btn svg { width: 15px; height: 15px; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 8px; font-size: 11px; font-weight: 800; white-space: nowrap; }
.status { border-radius: 99px; }
.status i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 99px; background: var(--card); box-shadow: var(--shadow); font-size: 12px; font-weight: 800; white-space: nowrap; }
.tag .art { width: 18px; height: 18px; }
.tag svg { width: 15px; height: 15px; }

/* Hero */
.hero { position: relative; overflow: hidden; background: var(--hero); color: #fff; border-radius: 24px; padding: 18px; box-shadow: 0 12px 28px rgba(31,107,255,.3); display: flex; flex-direction: column; gap: 10px; text-align: left; }
.hero > * { position: relative; }
.hero .deco { position: absolute; right: 14px; top: 58px; width: 104px; height: 62px; opacity: .5; pointer-events: none; }
.hero .label { font-size: 14px; font-weight: 700; }
.hero .label span { font-size: 12px; opacity: .8; font-weight: 500; }
.hero .big { font-family: var(--num); font-size: 38px; font-weight: 900; line-height: 1.05; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.hero .eye { color: #fff; width: 34px; height: 34px; }
.hero-tiles { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); color: var(--ink); border-radius: 16px; padding: 10px 0; }
.hero-tiles.two { grid-template-columns: 1fr 1fr; }
.hero-tile { padding: 0 12px; min-width: 0; }
.hero-tile + .hero-tile { border-left: 1px solid var(--line); }
.hero-tile .t { font-size: 11.5px; color: var(--muted); }
.hero-tile .v { font-family: var(--num); font-weight: 900; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero-hint { font-size: 11.5px; opacity: .9; }
.hero-hint button { color: #fff; text-decoration: underline; text-underline-offset: 2px; font-weight: 700; }

/* Stat tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tiles.two { grid-template-columns: 1fr 1fr; }
.tile { background: var(--card); border-radius: 18px; padding: 12px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 10px; min-width: 0; text-align: left; }
.tile.col { flex-direction: column; align-items: flex-start; gap: 4px; }
.tile .ic { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; }
.tile .ic svg { width: 20px; height: 20px; }
.tile .ic .art { width: 34px; height: 34px; }
.tile .t { font-size: 12px; color: var(--muted); }
.tile .v { font-family: var(--num); font-size: 19px; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.big-tile { border-radius: 20px; padding: 14px; display: flex; align-items: center; gap: 8px; min-width: 0; box-shadow: var(--shadow); text-align: left; }
.big-tile .art { width: 58px; height: 58px; flex: none; }
.big-tile .v { font-family: var(--num); font-size: 25px; font-weight: 900; font-variant-numeric: tabular-nums; }

/* Charts */
.chart-wrap { position: relative; }
.chart { display: block; width: 100%; }
.chart-wrap.axes { padding-left: 34px; }
.axis-y { position: absolute; left: 0; width: 31px; text-align: right; font-size: 10px; color: var(--muted); transform: translateY(-50%); font-variant-numeric: tabular-nums; }
.grid-line { position: absolute; left: 34px; right: 0; border-top: 1px dashed var(--line); }
.axis-x { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 4px; padding-left: 34px; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 6px; }
.chip { flex: 1; padding: 6px 0; border-radius: 99px; font-size: 12px; font-weight: 800; color: var(--ink); background: var(--card); text-align: center; box-shadow: 0 2px 6px rgba(31,107,255,.06); white-space: nowrap; }
.chip.on { background: var(--blue); color: #fff; box-shadow: 0 4px 10px rgba(31,107,255,.3); }
.chips.soft .chip { background: var(--card-2); box-shadow: none; }
.chips.soft .chip.on { background: var(--blue); }
.bars { display: flex; align-items: flex-end; gap: 5px; height: 130px; position: relative; }
.bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
.bars .b i { display: block; width: 100%; max-width: 18px; border-radius: 5px 5px 2px 2px; background: color-mix(in srgb, var(--blue) 45%, var(--card)); }
.bars .b.hl i { background: var(--blue); }
.bars .b em { position: absolute; transform: translateY(-120%); font-style: normal; font-size: 10px; font-weight: 800; color: #fff; background: var(--blue); padding: 1px 5px; border-radius: 6px; white-space: nowrap; }
.bars-x { display: flex; gap: 5px; font-size: 9px; letter-spacing: -.3px; color: var(--muted); margin-top: 4px; white-space: nowrap; }
.bars-x span { flex: 1; text-align: center; }

/* Lists */
.list-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; min-width: 0; width: 100%; text-align: left; }
.list-row + .list-row, .list-sep { border-top: 1px solid var(--line); }
.list-row .chev { width: 16px; height: 16px; color: var(--muted); flex: none; }
.fund-line { display: flex; align-items: center; gap: 6px; border-top: 1px solid var(--line); }
.fund-line:first-child { border-top: 0; }
.fund-line .list-row { border-top: 0; }
.star { width: 34px; height: 44px; display: grid; place-items: center; color: color-mix(in srgb, var(--muted) 55%, var(--card)); flex: none; }
.star.on { color: var(--orange); }
.star svg { width: 20px; height: 20px; }
.price-col { text-align: right; flex: none; }
.date-box { width: 50px; flex: none; text-align: center; border-radius: 12px; background: color-mix(in srgb, var(--blue) 9%, var(--card)); padding: 5px 0; line-height: 1.2; }
.date-box b { display: block; font-family: var(--num); font-size: 14px; color: var(--blue); }
.date-box span { font-size: 10.5px; color: var(--muted); }
.bar-row { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--card); border-radius: 16px; padding: 12px 12px 12px 18px; box-shadow: 0 3px 10px rgba(31,107,255,.06); overflow: hidden; min-width: 0; }
.bar-row::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 4px; background: var(--accent, var(--blue)); }
.bar-row .chev { width: 16px; height: 16px; color: var(--muted); flex: none; }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* Segments */
.seg { display: flex; }
.seg button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 4px; font-size: 14px; font-weight: 700; color: var(--muted); }
.seg button::after { content: ""; width: 26px; height: 3px; border-radius: 3px; background: transparent; }
.seg button.on { color: var(--blue); font-weight: 900; }
.seg button.on::after { background: var(--blue); }
.seg.pill { background: color-mix(in srgb, var(--blue) 8%, var(--card)); border-radius: 14px; padding: 4px; gap: 4px; }
.seg.pill button { padding: 8px 0; border-radius: 11px; flex-direction: row; justify-content: center; gap: 5px; }
.seg.pill button svg { width: 16px; height: 16px; }
.seg.pill button::after { display: none; }
.seg.pill button.on { background: var(--blue); color: #fff; box-shadow: 0 4px 10px rgba(31,107,255,.28); }
.seg.pill.light button.on { background: var(--card); color: var(--blue); box-shadow: 0 2px 6px rgba(15,31,61,.08); }
.filter-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.filter-chips button { flex: none; padding: 6px 12px; border-radius: 99px; font-size: 12.5px; font-weight: 800; background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.filter-chips button.on { background: var(--blue); color: #fff; }

/* Search & selectors */
.search { display: flex; align-items: center; gap: 8px; background: var(--field); border-radius: 16px; padding: 0 12px; box-shadow: var(--shadow); }
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; background: none; padding: 12px 0; outline: none; }
.search .clear { color: var(--muted); }
.opt-rows { display: flex; flex-direction: column; gap: 10px; }
.opt-row { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 8px; }
.opt-row > b { font-size: 13px; display: flex; align-items: center; gap: 6px; }
.opt-row > b::before { content: ""; width: 3px; height: 14px; border-radius: 3px; background: var(--orange); }
.opts { display: flex; gap: 6px; flex-wrap: wrap; }
.opt { padding: 6px 12px; border-radius: 99px; background: var(--card-2); color: var(--ink); font-weight: 700; font-size: 13px; white-space: nowrap; }
.opt.on { background: var(--blue); color: #fff; box-shadow: 0 4px 10px rgba(31,107,255,.25); }
.opt:disabled { opacity: .4; }
.opt-group { display: flex; flex-direction: column; gap: 10px; padding: 12px 0; }
.opt-group + .opt-group { border-top: 1px solid var(--line); }
.opt-group > b { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.opt-group > b svg { width: 20px; height: 20px; color: var(--blue); }

/* Category cards */
.cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.cat { border-radius: 18px; padding: 10px 6px 12px; display: flex; flex-direction: column; align-items: center; gap: 1px; border: 1.5px solid transparent; }
.cat .art { width: 66px; height: 60px; margin-bottom: 4px; }
.cat .n { font-weight: 900; font-size: 15px; color: var(--ink); }
.numbered { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 900; margin: 0; }
.numbered i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 12px; display: grid; place-items: center; font-family: var(--num); }

/* Detail */
.price-big { font-family: var(--num); font-size: 34px; font-weight: 900; font-variant-numeric: tabular-nums; }
.market-badge { padding: 3px 9px; border-radius: 99px; background: var(--blue); color: #fff; font-size: 11px; font-weight: 800; white-space: nowrap; }
.emo-box { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; flex: none; }
.emo-box .art { width: 50px; height: 46px; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
.kv > div { display: flex; justify-content: space-between; gap: 6px; }
.kv-list > div { display: flex; justify-content: space-between; gap: 14px; padding: 8px 0; }
.kv-list > div + div { border-top: 1px solid var(--line); }
.kv-list span:last-child { text-align: right; min-width: 0; overflow-wrap: anywhere; }
.kv-list .hl { background: color-mix(in srgb, var(--blue) 9%, var(--card)); margin: 4px -10px 0; padding: 10px; border-radius: 12px; border-top: 0 !important; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card-2); border-radius: 16px; padding: 12px 0; }
.stats3 > div { padding: 0 12px; min-width: 0; }
.stats3 > div + div { border-left: 1px solid var(--line); }
.stats3 .t { font-size: 11.5px; color: var(--muted); }
.stats3 .v { font-family: var(--num); font-weight: 900; font-size: 17px; white-space: nowrap; }
.facets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.facet { background: var(--card-2); border-radius: 14px; padding: 10px 4px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.facet .fi { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; }
.facet .fi svg { width: 20px; height: 20px; }
.facet b { font-size: 12.5px; }
.facet span { font-size: 10.5px; color: var(--muted); line-height: 1.3; }

/* Holdings */
.donut-wrap { display: flex; align-items: center; gap: 16px; }
.donut-box { position: relative; width: 128px; height: 128px; flex: none; }
.donut { width: 128px; height: 128px; transform: rotate(-90deg); display: block; }
.donut-wrap.amt { gap: 12px; }
.donut-wrap.amt .donut-box, .donut-wrap.amt .donut { width: 112px; height: 112px; }
.donut-wrap.amt .legend .row { gap: 6px; font-size: 13px; }
.donut-wrap.amt .legend .row .grow { min-width: 3.2em; }
.donut-wrap.amt .legend .pc { width: 40px; }
.donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.donut-center span { font-size: 11px; color: var(--muted); }
.donut-center b { font-family: var(--num); font-size: 17px; font-weight: 900; }
.legend { flex: 1; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.legend .row i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.legend .row .pc { color: var(--muted); font-size: 12px; width: 44px; text-align: right; }
.bar { height: 7px; border-radius: 7px; background: color-mix(in srgb, var(--blue) 12%, var(--card)); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--blue); border-radius: 7px; }
select.inline { border: 0; background: none; font-size: 13px; font-weight: 800; color: var(--ink); padding: 4px 0; }
.sel-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sel-row select { width: 100%; border: 0; background: var(--card); box-shadow: var(--shadow); border-radius: 12px; padding: 9px 8px; font-size: 13px; font-weight: 700; }
table.grid { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.grid th { font-size: 11.5px; color: var(--muted); font-weight: 700; text-align: left; padding: 6px 4px; }
table.grid td { padding: 10px 4px; border-top: 1px solid var(--line); text-align: left; }
table.grid .r { text-align: right; }
table.grid tr.click { cursor: pointer; }

/* Calendar */
.month-nav { display: flex; align-items: center; justify-content: center; gap: 12px; }
.month-nav b { font-size: 17px; font-weight: 900; min-width: 120px; text-align: center; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; text-align: center; }
.cal-grid .wd { font-size: 11px; font-weight: 800; color: var(--muted); padding: 6px 0; }
.cal-grid .wd:first-child { color: var(--red); }
.day { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 3px 0; min-height: 44px; }
.day b { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 10px; font-weight: 600; font-family: var(--num); font-variant-numeric: tabular-nums; }
.day.today b { background: var(--blue); color: #fff; font-weight: 900; box-shadow: 0 4px 10px rgba(31,107,255,.3); }
.day.pick b { box-shadow: inset 0 0 0 1.5px var(--blue); font-weight: 900; }
.dots { display: flex; gap: 2px; height: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; }
.legend-row { display: flex; justify-content: center; gap: 16px; font-size: 11.5px; color: var(--muted); }
.legend-row span { display: inline-flex; align-items: center; gap: 5px; }
.legend-row i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* Tools */
.tool-head { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 900; margin: 0 0 10px; }
.tool-head .hi { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: #fff; }
.tool-head .hi svg { width: 16px; height: 16px; }
.tool-grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tool-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tool { background: var(--card-2); border-radius: 18px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; min-width: 0; }
.tool .art { width: 54px; height: 50px; margin-bottom: 4px; }
.tool b { font-size: 14px; }
.tool span { font-size: 11px; color: var(--muted); }
.tool.wide { flex-direction: row; justify-content: flex-start; gap: 10px; padding: 12px; text-align: left; }
.tool.wide .art { width: 46px; height: 46px; margin: 0; flex: none; }
.tool-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; width: 100%; text-align: left; }
.tool-row + .tool-row { border-top: 1px solid var(--line); }
.tool-row .ri { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex: none; }
.tool-row .ri svg { width: 21px; height: 21px; }
.tool-row .ri .art { width: 34px; height: 34px; }
.tool-row .chev { width: 16px; height: 16px; color: var(--muted); }
.table-wrap { overflow-x: auto; }
table.cmp { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.cmp th, table.cmp td { padding: 9px 6px; text-align: center; border-bottom: 1px solid var(--line); }
table.cmp th:first-child, table.cmp td:first-child { text-align: left; color: var(--muted); font-weight: 600; font-size: 11.5px; }
table.cmp thead th { font-weight: 900; font-size: 13px; color: #fff; border-radius: 10px 10px 0 0; }
table.cmp thead th:first-child { background: none; }
.sym-chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sym-chip { position: relative; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 8px 26px 8px 10px; min-width: 0; }
.sym-chip b { display: block; font-size: 14px; }
.sym-chip span { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sym-chip select { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
.sym-chip .x { position: absolute; right: 4px; top: 4px; z-index: 2; width: 22px; height: 22px; display: grid; place-items: center; color: var(--muted); }
.sym-chip .x svg { width: 14px; height: 14px; }
.sym-chip.add { display: grid; place-items: center; color: var(--blue); font-weight: 800; padding: 8px; border: 1.5px dashed color-mix(in srgb, var(--blue) 40%, transparent); box-shadow: none; background: none; }

/* Forms */
.form { display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 13px; font-weight: 800; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--field); border-radius: 12px; padding: 11px 12px; }
.field textarea { min-height: 120px; font-size: 13px; font-family: ui-monospace, Menlo, Consolas, monospace; }
.frow { display: grid; grid-template-columns: 112px 1fr; align-items: center; gap: 10px; padding: 7px 0; }
.frow + .frow { border-top: 1px solid var(--line); }
.frow > label { font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
.frow > label.lbl::before { content: ""; width: 3px; height: 14px; border-radius: 3px; background: var(--blue); flex: none; }
.frow .inp { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--field); border-radius: 12px; padding: 0 10px; min-width: 0; }
.frow .inp input, .frow .inp select { flex: 1; min-width: 0; border: 0; background: none; padding: 10px 0; outline: none; }
.frow .inp .unit { color: var(--muted); font-size: 13px; flex: none; }
.frow .inp svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.switch { position: relative; width: 50px; height: 30px; border-radius: 99px; background: color-mix(in srgb, var(--muted) 35%, var(--card)); flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .15s; }
.switch.on { background: var(--blue); }
.switch.on::after { transform: translateX(20px); }
.field input[type=range] { padding: 0; border: 0; accent-color: var(--blue); }
.error { color: var(--red); font-size: 13px; margin: 0; }
.out { display: flex; flex-direction: column; gap: 2px; }
.out > div { display: flex; justify-content: space-between; padding: 7px 0; }
.out > div + div { border-top: 1px solid var(--line); }
.result-big { font-family: var(--num); font-size: 30px; font-weight: 900; color: var(--blue); }
.tip { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 14px; background: color-mix(in srgb, var(--yellow) 16%, var(--card)); font-size: 13px; }
.tip .art { width: 22px; height: 22px; flex: none; }
.hint-box { border-radius: 14px; padding: 10px 12px; background: color-mix(in srgb, var(--green) 10%, var(--card)); font-size: 12.5px; display: flex; align-items: center; gap: 8px; }
.hint-box button { margin-left: auto; color: var(--blue); font-weight: 800; white-space: nowrap; }

/* Settings */
.set-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; width: 100%; text-align: left; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.set-row .si { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: #fff; flex: none; }
.set-row .si svg { width: 17px; height: 17px; }
.set-row .chev { width: 16px; height: 16px; color: var(--muted); flex: none; }
.set-row img.si { background: #fff; object-fit: cover; box-shadow: inset 0 0 0 1px var(--line); }
/* "Add to home screen": a phone home screen with the app icon dropped in among placeholder apps. */
.hs-preview { position: relative; overflow: hidden; border-radius: 26px; padding: 22px 12px 12px; background: linear-gradient(160deg, #6f9dff 0%, #9f8cff 46%, #ffb0c8 100%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); }
.hs-preview::before { content: ""; position: absolute; width: 220px; height: 220px; right: -70px; top: -90px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.45), rgba(255,255,255,0) 70%); }
.hs-grid { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 6px; justify-items: center; }
.hs-app { display: grid; justify-items: center; gap: 6px; min-width: 0; }
.hs-app i { display: block; width: 56px; height: 56px; border-radius: 14px; background: rgba(255,255,255,.26); box-shadow: inset 0 0 0 1px rgba(255,255,255,.32); }
.hs-app b { display: block; width: 34px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.42); }
.hs-app img { width: 56px; height: 56px; border-radius: 14px; background: #fff; box-shadow: 0 8px 18px rgba(30,40,120,.32); animation: hs-pop .7s cubic-bezier(.34,1.56,.64,1) .25s both; }
.hs-app span { font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.35); white-space: nowrap; }
.hs-dock { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); justify-items: center; margin-top: 22px; padding: 10px 6px; border-radius: 24px; background: rgba(255,255,255,.24); box-shadow: inset 0 0 0 1px rgba(255,255,255,.3); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.hs-dock i { display: block; width: 50px; height: 50px; border-radius: 13px; background: rgba(255,255,255,.3); }
@keyframes hs-pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .hs-app img { animation: none; } }
.steps { list-style: none; counter-reset: step; margin: 6px 0 0; padding: 0; }
.steps li { counter-increment: step; display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; line-height: 1.55; }
.steps li::before { content: counter(step); flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; display: grid; place-items: center; background: var(--blue); color: #fff; font-size: 13px; font-weight: 800; }
.steps .key { display: inline-flex; align-items: center; gap: 3px; padding: 0 6px; border-radius: 7px; background: var(--card-2); font-weight: 700; white-space: nowrap; }
.steps .key svg { width: 14px; height: 14px; }
.install-banner { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
.install-banner img { width: 46px; height: 46px; border-radius: 12px; flex: none; background: #fff; box-shadow: 0 4px 12px rgba(31,107,255,.18), inset 0 0 0 1px var(--line); }
.install-banner .x { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.install-banner .x svg { width: 15px; height: 15px; }
/* Taiwan market: index cards, market badges, symbol avatars and connection status. */
.mkt-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ix-card { position: relative; overflow: hidden; border-radius: 20px; padding: 12px 12px 0; background: linear-gradient(180deg, color-mix(in srgb, var(--blue) 10%, var(--card)), var(--card)); box-shadow: var(--shadow); display: flex; flex-direction: column; min-width: 0; }
.ix-card.otc { background: linear-gradient(180deg, color-mix(in srgb, var(--purple) 11%, var(--card)), var(--card)); }
.ix-card .h { display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 15px; }
.ix-card .h svg { width: 18px; height: 18px; color: var(--blue); }
.ix-card.otc .h svg { color: var(--purple); }
.ix-card .v { font-family: var(--num); font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; margin-top: 8px; line-height: 1.1; white-space: nowrap; }
.ix-card .c { font-size: 12.5px; margin-top: 3px; white-space: nowrap; }
.ix-card .spark { margin: 6px -12px 0; }
.ix-card .cap { font-size: 11px; color: var(--muted); padding: 4px 0 9px; }
/* A changed live price flashes briefly. */
@keyframes tick-up { from { background: color-mix(in srgb, var(--green) 30%, transparent); } to { background: transparent; } }
@keyframes tick-down { from { background: color-mix(in srgb, var(--red) 28%, transparent); } to { background: transparent; } }
.tick-up { animation: tick-up 1.1s ease-out; border-radius: 6px; }
.tick-down { animation: tick-down 1.1s ease-out; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { .tick-up, .tick-down { animation: none; } }
.live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 4px; vertical-align: middle; animation: live-pulse 1.6s ease-in-out infinite; }
@keyframes live-pulse { 50% { opacity: .35; } }
.mk { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 6px; font-size: 11px; font-weight: 800; white-space: nowrap; color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, var(--card)); }
.mk.tpex { color: #0d9fb4; background: color-mix(in srgb, #0d9fb4 13%, var(--card)); }
.mk.etf { color: var(--orange); background: color-mix(in srgb, var(--orange) 14%, var(--card)); }
.av { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 14px; flex: none; letter-spacing: -.5px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25), 0 4px 10px rgba(15,31,61,.12); }
.av.code { font-size: 12px; letter-spacing: -.2px; }
.av.big { width: 58px; height: 58px; border-radius: 16px; font-size: 18px; }
.av.big.code { font-size: 15px; }
.conn { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; white-space: nowrap; }
.conn i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 20%, transparent); }
.conn.on { color: var(--green); }
.conn.off { color: var(--pink); }
.conn.close { color: var(--blue); }
/* Home page (same design as the iPhone app): search, scope tabs, asset card, market, watchlist, dividends and simulation. */
/* Header: a white card with the pocket (soft shadow), 「投資」 in blue, 「袋著走」 in ink and the tagline. */
.home-head { display: flex; align-items: center; gap: 10px; margin-top: calc(6px + env(safe-area-inset-top, 0px)); padding: 12px 8px 12px 14px; border-radius: 22px; background: var(--card); box-shadow: var(--shadow); }
.home-head .logo { width: 50px; height: 50px; object-fit: contain; flex: none; filter: drop-shadow(0 4px 6px rgba(20,50,120,.25)); }
.home-head .brand { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.home-head .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.1; }
.home-head .wm-a { font-size: 30px; font-weight: 900; color: var(--blue); letter-spacing: .5px; }
.home-head .wm-b { font-size: 26px; font-weight: 900; color: var(--ink); letter-spacing: .5px; }
.home-head .brand-tag { font-size: 11.5px; font-weight: 500; color: var(--muted); letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.home-head .icon-btn { width: 36px; flex: none; }
.home-search { display: flex; align-items: center; gap: 10px; width: 100%; height: 46px; padding: 0 16px; border-radius: 99px; background: var(--card); box-shadow: var(--shadow); color: var(--muted); font-size: 15px; text-align: left; }
.home-search svg { width: 20px; height: 20px; color: var(--ink); flex: none; }
.home-tabs { display: flex; gap: 26px; padding-left: 12px; }
.home-tabs button { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 16px; font-weight: 700; color: color-mix(in srgb, var(--ink) 75%, transparent); }
.home-tabs button::after { content: ""; width: 44px; height: 3px; border-radius: 3px; background: transparent; }
.home-tabs button.on { color: var(--blue); font-weight: 900; }
.home-tabs button.on::after { background: var(--blue); }
.home-hero { position: relative; overflow: hidden; border-radius: 24px; padding: 18px; color: #fff; background: var(--hero); border: 1px solid rgba(255,255,255,.35); box-shadow: 0 12px 28px rgba(31,107,255,.3); cursor: pointer; text-align: left; }
.home-hero > * { position: relative; }
.home-hero > .wave { position: absolute; left: 0; bottom: 0; width: 100%; height: 62%; pointer-events: none; }
.home-hero > .glass { position: absolute; right: 12px; bottom: 12px; width: 90px; height: 100px; pointer-events: none; }
.hh-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hh-top b { font-size: 19px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

function httpMessage(code) {
  if (code === 401) return "金鑰無效或已失效，請重新確認行情金鑰。";
  if (code === 403) return "目前方案沒有這項資料權限；已有資料會保留。";
  if (code === 429) return "已達資料請求額度，請稍後重試；已有資料會保留。";
  return `資料服務暫時無法使用（${code}），保留上次成功資料。`;
}
async function fugle(path, sym, query) {
  if (!/^[0-9A-Z]{3,8}$/.test(sym)) throw new Error("代號格式不正確。");
  const key = fugleKey();
  if (!key) throw new Error("請先在「設定 › 富果行情連線」存入你的富果 API Key。");
  const url = new URL(`https://api.fugle.tw/marketdata/v1.0/stock/${path}/${sym}`);
  Object.entries(query || {}).forEach(([k, v]) => url.searchParams.set(k, v));
  let res;
  try { res = await fetch(url, { headers: { "X-API-KEY": key, Accept: "application/json" }, redirect: "error", cache: "no-store" }); }
  catch (e) { throw new Error("連不上行情服務，請確認網路後再試。"); }
  if (!res.ok) { const err = new Error(httpMessage(res.status)); err.status = res.status; throw err; }
  return res.json();
}
const num = (v) => (typeof v === "number" && isFinite(v) ? v : null);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function fetchQuote(sym) {

  const price = num(q.closePrice) != null ? q.closePrice : num(q.lastPrice);
  if (q.symbol !== sym || t.symbol !== sym || !(price > 0)) throw new Error(`${sym} 沒有有效成交價，請稍後再試。`);
  return { price, change: num(q.change), changePercent: num(q.changePercent), open: num(q.openPrice), high: num(q.highPrice), low: num(q.lowPrice), volume: q.total ? num(q.total.tradeVolume) : null, date: String(q.date || ""), fetchedAt: Date.now(), currency: t.tradingCurrency || "UNKNOWN" };
}
async function fetchHistory(sym, years) {
  const end = new Date(); const earliest = new Date(2010, 0, 1);
  let cursor = new Date(Math.max(new Date(end.getFullYear() - years, end.getMonth(), end.getDate()).getTime(), earliest.getTime()));
  const byDate = new Map();
  while (cursor <= end) {
    const chunkEnd = new Date(Math.min(new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate() + 359).getTime(), end.getTime()));
    try {
      const j = await fugle("historical/candles", sym, { from: dayStr(cursor), to: dayStr(chunkEnd), timeframe: "D", adjusted: "true", fields: "close", sort: "asc" });
      if (j.symbol !== sym || j.adjusted !== true || j.timeframe !== "D") throw new Error("行情服務未確認還原價格，未計算績效。");
      (j.data || []).forEach((p) => { if (/^\d{4}-\d{2}-\d{2}$/.test(p.date) && num(p.close) > 0) byDate.set(p.date, p.close); });
    } catch (e) { if (e.status !== 404) throw e; /* pre-listing or non-trading intervals may contain no data */ }
    cursor = new Date(chunkEnd.getFullYear(), chunkEnd.getMonth(), chunkEnd.getDate() + 1);
    if (cursor <= end) await sleep(1100);
  }
  const points = [...byDate.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  if (points.length < 2) throw new Error("這段期間沒有足夠的歷史資料。");
  return points;
}

/* ---------- live market data during trading hours ----------

   auth message, never in a URL; REST polling within the plan's rate limit for the rest and for both indices.
   Everything stops while the app is hidden and resumes with a catch-up refresh; reconnects back off with jitter.
   Free plan: 1 connection, 5 subscriptions, 60 intraday requests a minute. Paid plans: snapshot every 5 s. */

function liveWanted() { return CAN_FUGLE && !!fugleKey() && document.visibilityState === "visible" && liveOpen(); }

const subLimit = () => Math.min(LIVE.cap, paidPlan() ? 280 : 5);

  const v = current(), d = data();

  [...d.holdings].sort((a, b) => (holdingValue(d, b) || 0) - (holdingValue(d, a) || 0)).forEach((h) => add(h.symbol));
  d.favorites.forEach(add);

function liveSend(message) { const ws = LIVE.ws; if (ws && ws.readyState === 1) ws.send(JSON.stringify(message)); }
function liveConnect() {
  LIVE.reTimer = null;
  if (LIVE.ws || LIVE.noStream || Date.now() < LIVE.busyUntil || !liveWanted()) return;
  let ws;
  try { ws = new WebSocket((LIVE_TEST && LIVE_TEST.streamURL) || STREAM_URL); } catch (e) { liveFailed(); return; }
  LIVE.ws = ws; LIVE.authed = false; LIVE.lastMsg = Date.now();
  ws.onopen = () => { if (LIVE.ws === ws) ws.send(JSON.stringify({ event: "auth", data: { apikey: fugleKey() } })); };
  ws.onmessage = (ev) => { if (LIVE.ws === ws) liveMessage(ev.data); };
  ws.onclose = (ev) => { if (LIVE.ws === ws) liveClosed(ev); };
  liveStatusChanged();
}
/* Close without reconnecting (hidden, closed market, refused key). */
function liveClose() {
  const ws = LIVE.ws;
  LIVE.ws = null; LIVE.authed = false; LIVE.subs.clear(); LIVE.pending.clear();
  if (ws) { ws.onopen = ws.onmessage = ws.onclose = null; try { ws.close(1000); } catch (e) { /* already closed */ } }

function liveStop() { clearTimeout(LIVE.reTimer); LIVE.reTimer = null; liveClose(); liveStatusChanged(); }
function liveFailed() {
  LIVE.ws = null; LIVE.fails++;

  if (LIVE.fails >= 3) { LIVE.noStream = true; LIVE.note = "這個瀏覽器連不上即時串流，改為定時更新。"; liveStatusChanged(); return; }
  liveReconnectLater();

function liveClosed(ev) {

  if (ev && (ev.code === 1013 || /maximum number of connections/i.test(ev.reason || ""))) { liveBusy(); return; }

  LIVE.retry++;
  const base = Math.min(1000 * 2 ** (LIVE.retry - 1), 60000);
  LIVE.reTimer = setTimeout(liveConnect, base / 2 + Math.random() * base / 2);

}

    if ((LIVE.authed && (LIVE.subs.size || !liveTargets().length)) || fresh) return ["盤中即時", "var(--green)"];
    // Just opened, or the socket is still authenticating: not an error yet.
    if (!LIVE.lastLoop || (LIVE.ws && !LIVE.authed) || (!LIVE.ws && !LIVE.reTimer && !LIVE.noStream && Date.now() >= (LIVE.busyUntil || 0) && Date.now() - (LIVE.openedAt || 0) < 20000)) return ["連線中", "var(--blue)"];

  { key: "management", title: "管理方式", ic: "gear", options: ["主動型", "被動型"], of: mgmtLabel, single: true },

  { key: "freqs", title: "配息頻率", ic: "calendar", options: ["月配", "雙月配", "季配", "半年配", "年配", "不配息"], of: (x) => freqOf(x.id) },

  { key: "structures", title: "商品結構", ic: "struct", options: ["一般型", "槓桿型", "反向型"], of: structureOf },
];
function matchFilter(x, f) {
  if (f.strategies.length && !f.strategies.includes(x.strategy)) return false;
  for (const g of FILTER_GROUPS) {
    const v = f[g.key];
    if (g.single ? v && g.of(x) !== v : v.length && !v.includes(g.of(x))) return false;
  }
  return true;
}
function filteredFunds(scope) {
  const q = S.ui.q.trim().toLowerCase(), f = S.ui.filter, d = data();
  return FUNDS.filter((x) => matchFilter(x, f) && (!scope || d.favorites.includes(x.id)) && (!q || x.id.toLowerCase().includes(q) || x.name.toLowerCase().includes(q)));
}
function activeChips() {
  const f = S.ui.filter, chips = f.strategies.map((v) => ["strategies", v]);
  FILTER_GROUPS.forEach((g) => { const v = f[g.key]; if (g.single) { if (v) chips.push([g.key, v]); } else v.forEach((x) => chips.push([g.key, x])); });
  return chips;
}

/* ---------- 個股＋ETF 組合試算 ----------

   month end (or start), split between stocks and ETFs by the chosen mix. Without reinvestment, a cash yield is

  c.excluded = Array.isArray(c.excluded) ? c.excluded.filter((x) => typeof x === "string") : [];

function parseCSV(text) {

    if (c === '"') q = true; else if (c === ",") { row.push(cell); cell = ""; } else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; } else cell += c;

async function download(name, text, type) {
  // Claude artifact pages may only offer files through the downloads capability.
  if (window.claude && typeof window.claude.use === "function") {
    const dl = await window.claude.use("downloads").catch(() => null);
    if (!dl) { toast("這裡無法下載檔案，請改用複製的方式備份。"); return; }
    try { await dl.save({ filename: name, data: text }); toast("已存檔：" + name); }
    catch (e) { toast(e && e.code === "declined" ? "已取消下載" : "這裡無法下載檔案，請改用複製的方式備份。"); }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([text], { type })); const a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast(`正在下載 ${name}（沒有反應時請改用複製）`);
  } catch (e) { toast("這個環境無法下載檔案，請改用複製的方式備份。"); }
}
function logTrade(d, action, h, extra) {
  if (!d.trades) d.trades = [];
  d.trades.push(Object.assign({ id: uid(), date: today(), action, symbol: h.symbol, name: h.name, shares: h.shares, unitCost: h.unitCost, amount: Math.round(h.shares * h.unitCost * 100) / 100, broker: h.broker || "" }, extra || {}));
  if (d.trades.length > 500) d.trades.splice(0, d.trades.length - 500);
}
function importJSON(text) {
  const err = $("#import-err"); let raw;
  try { raw = JSON.parse(text); } catch (e) { if (err) err.textContent = "內容不是有效的 JSON，請使用這個網頁版匯出的備份。"; return; }
  if (!raw || raw.schema !== 1 || !Array.isArray(raw.holdings) || !Array.isArray(raw.dividends)) { if (err) err.textContent = "格式不符，請使用這個網頁版匯出的內容（App 的備份格式不同）。"; return; }
  const before = JSON.stringify(body(S.mine)); const keep = S.mine; S.mine = emptyData(); applyMine(raw); const parsed = S.mine; S.mine = keep;
  const merge = (key) => parsed[key].forEach((x) => { const list = S.mine[key]; const i = list.findIndex((y) => y.id === x.id); if (i >= 0) list[i] = x; else list.push(x); });
  merge("holdings"); merge("dividends"); merge("trades");
  parsed.favorites.forEach((s) => { if (!S.mine.favorites.includes(s)) S.mine.favorites.push(s); });
  if (parsed.comparison.length) S.mine.comparison = parsed.comparison;
  if (raw.goal) S.mine.goal = parsed.goal; if (raw.plan) S.mine.plan = parsed.plan;
  persist(); renderScreen();
  toast(JSON.stringify(body(S.mine)) === before ? "沒有新的紀錄需要匯入" : `已匯入 ${parsed.holdings.length} 筆持有、${parsed.dividends.length} 筆配息、${parsed.trades.length} 筆交易`);
}
async function loadHistories(list, years) {
  for (const sym of list) {
    if (liveBlocked()) return;
    busy = "history:" + sym; renderScreen();
    try { S.mine.histories[sym] = await fetchHistory(sym, years); persistHistories(); } catch (e) { toast(`${sym}：${e.message}`); }
    busy = null; renderScreen();
  }
  toast("已更新績效資料");
}

  useOfficial: (ds) => {
    const e = officialEvents(ds.sym).find((o) => o.ex === ds.ex); if (!e) return;
    $("#v-per").value = e.amount || ""; $("#v-ex").value = e.ex; $("#v-date").value = e.pay || e.ex;
    $("#v-source").value = (e.pay || e.ex) > today() ? "投信公告" : "證券帳務";
    if (!$("#v-shares").value) { const held = sum(data().holdings.filter((h) => h.symbol === ds.sym), (h) => h.shares); if (held) $("#v-shares").value = held; }
    updateDivForm(); toast("已帶入官方公告的金額與日期");
  },
  saveDividend: (ds) => {
    const err = (m) => { $("#v-error").textContent = m; };
    const symbol = val("v-symbol").toUpperCase(), shares = numVal("v-shares"), per = numVal("v-per"), date = val("v-date"), ex = val("v-ex"), ded = numVal("v-ded") || 0, source = val("v-source"), note = val("v-note");
    const status = (DIV_SOURCES.find(([s]) => s === source) || DIV_SOURCES[0])[1];
    if (!/^[0-9A-Z]{3,8}$/.test(symbol)) return err("請輸入正確的股票或 ETF 代號。");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return err("請選擇發放日期。");
    if (ex && !/^\d{4}-\d{2}-\d{2}$/.test(ex)) return err("除息日格式不正確。");
    if (!(ded >= 0 && ded <= 1e9)) return err("扣繳費用不可為負數。");
    let amount, detail = {};
    if (shares > 0 && per > 0) { amount = Math.round(shares * per) - ded; detail = { shares, perShare: per, deduction: ded }; }
    else if ($("#v-total") && numVal("v-total") > 0) amount = numVal("v-total");
    else return err("請填寫符合資格股數與每股配息金額。");
    if (!(amount > 0 && amount <= 1e10)) return err("扣繳後的入帳金額必須大於 0。");
    if (note.length > 80) return err("備註請在 80 字以內。");
    const d = data(), old = ds.id ? d.dividends.find((x) => x.id === ds.id) : null;
    const rec = Object.assign({ id: old ? old.id : uid(), symbol, date, amount, status, source }, detail, ex ? { exDate: ex } : {}, note ? { note } : {});
    if (old) d.dividends[d.dividends.indexOf(old)] = rec; else d.dividends.push(rec);
    S.stacks[S.tab].pop(); commit(); toast(old ? "已更新配息紀錄" : "已記錄配息");
  },
  confirmPaid: (ds) => {
    const x = data().dividends.find((y) => y.id === ds.id); if (!x) return;
    x.status = "已入帳"; x.source = "證券帳務"; if (x.date > today()) x.date = today();
    persist(); go("divDone", { id: x.id });
  },
  doneDiv: () => { popTo((v) => !["divDone", "divDetail"].includes(v.view)); renderScreen(); window.scrollTo(0, 0); },
  askDeleteDiv: (ds) => { S.ui.confirmDeleteId = ds.id; renderScreen(); },
  deleteDividend: (ds) => { const d = data(); d.dividends = d.dividends.filter((x) => x.id !== ds.id); S.ui.confirmDeleteId = null; popTo((v) => !["divDetail", "divForm"].includes(v.view)); commit(); toast("已刪除配息紀錄"); },
  exportYear: () => {
    const d = data(), y = S.ui.year, rows = d.dividends.filter((x) => x.status === "已入帳" && x.date.startsWith(y + "-")).sort((a, b) => a.date.localeCompare(b.date));
    const q = (s) => `"${String(s == null ? "" : s).replace(/"/g, '""')}"`;
    const csv = "﻿" + [["入帳日期", "代號", "名稱", "除息日", "每單位配息", "股數", "扣繳費用", "入帳金額", "紀錄類型", "備註"].join(",")].concat(rows.map((x) => [x.date, x.symbol, nameOf(x.symbol, d), x.exDate || "", x.perShare || "", x.shares || "", x.deduction || 0, x.amount, x.source || "", x.note || ""].map(q).join(","))).join("\r\n");
    download(`配息紀錄-${y}.csv`, csv, "text/csv");
  },
  runPlan: () => { const p = readPlan(); if (!planValid(p)) { toast("輸入超出範圍，請檢查。"); return; } data().plan = p; persist(); updatePlan(); toast("已試算並儲存設定"); },
  toggleReinvest: (ds, el) => { el.classList.toggle("on"); el.setAttribute("aria-checked", el.classList.contains("on")); updatePlan(); },
  saveGoal: () => { data().goal = { target: Math.max(numVal("g-target") || 0, 0), capital: Math.max(numVal("g-capital") || 0, 0), yield: numVal("g-yield") }; persist(); updateGoal(); toast("已試算並儲存目標"); },
  loadYear: (ds) => loadHistories(ds.syms.split(",").filter(Boolean), 1),
  loadComp: (ds) => loadComponents(ds.sym),
  loadComps: (ds) => loadCompsFor(ds.syms.split(",").filter(Boolean)),
  theme: (ds) => { S.prefs.theme = ds.v; S.prefs.themeSet = true; savePrefs(); applyTheme(); renderScreen(); },
  hideInstall: () => { S.prefs.installHidden = true; savePrefs(); renderScreen(); toast("之後可在「設定 › 加入主畫面」找到"); },
  installOS: (ds) => { S.ui.installOS = ds.v; renderScreen(); },
  // GitHub Pages serves the profile as a generic download; handing Safari a blob with the profile type lets it
  // offer to install it. If that fails, the plain link still downloads the file.
  profile: async () => {
    try {
      const res = await fetch("ETFToGo.mobileconfig", { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      const blob = new Blob([await res.arrayBuffer()], { type: "application/x-apple-aspen-config" });
      location.href = URL.createObjectURL(blob);
    } catch (e) { location.href = "ETFToGo.mobileconfig"; }
  },
  install: async () => {
    const prompt = installPrompt; if (!prompt) return;
    installPrompt = null; prompt.prompt();
    try { const choice = await prompt.userChoice; if (choice && choice.outcome === "accepted") toast("已加入主畫面"); } catch (e) { /* the browser closed the prompt */ }
    renderScreen();
  },
  askClear: () => { S.ui.confirmClear = true; renderScreen(); },
  cancelClear: () => { S.ui.confirmClear = false; renderScreen(); },
  clearMine: () => { S.mine = emptyData(); S.ui.confirmClear = false; persist(); persistHistories(); renderScreen(); toast("已清除我的資料"); },
  refreshAll: () => (S.snapshotOK === false ? refreshQuotes() : refreshMarket()),
  refreshMarket: () => refreshMarket(),
  refreshOne: (ds) => refreshQuotes([ds.sym]),
  refreshOfficial: () => refreshOfficial(),
  refreshSources: async () => { if (CAN_FUGLE && fugleKey()) await refreshMarket(); await refreshOfficial(); },
  loadHistory: (ds) => { const sel = $("#hist-years"); loadHistory(ds.sym, Number(ds.years || (sel && sel.value) || 5)); },
  saveKey: () => {
    const el = $("#fk"); const key = (el.value || "").trim();
    if (!key) { S.ui.keyMsg = "請先貼上金鑰。"; renderScreen(); return; }
    if (key.length > 300 || /\s/.test(key)) { S.ui.keyMsg = "金鑰格式不正確，請重新複製。"; renderScreen(); return; }
    try { localStorage.setItem(FUGLE_KEY, key); } catch (e) { S.ui.keyMsg = "這個瀏覽器不允許儲存（例如私密瀏覽），請改用一般模式。"; renderScreen(); return; }
    el.value = ""; S.ui.keyMsg = "已存入這個瀏覽器，正在取得行情…"; S.snapshotOK = null; LIVE.noStream = false; LIVE.fails = 0; LIVE.cap = Infinity; LIVE.note = ""; liveResume(); renderScreen();
    refreshMarket();
  },
  testKey: async () => {
    if (busy) return;
    busy = "test"; S.ui.keyMsg = ""; renderScreen();
    try {
      const q = await fetchQuote("0050");
      S.mine.quotes["0050"] = q; persist();
      S.market["0050"] = q; saveMarket();
      S.ui.keyMsg = `連線成功：0050 報價日期 ${q.date}，${priceText(q.price)} 元。`;
    } catch (e) { S.ui.keyMsg = e.message; }
    busy = null; renderScreen();
  },
  removeKey: () => { try { localStorage.removeItem(FUGLE_KEY); } catch (e) { /* nothing stored */ } liveStop(); S.ui.keyMsg = "已移除金鑰。"; renderScreen(); },
  copyExport: () => { const box = $("#export-box"); try { navigator.clipboard.writeText(box.value).then(() => toast("已複製備份 JSON"), () => { box.select(); toast("請長按選取後複製"); }); } catch (e) { box.select(); toast("請長按選取後複製"); } },
  importData: () => importJSON($("#import-box").value),
  exportJSON: () => download(`投資袋著走-備份-${today()}.json`, JSON.stringify(body(data())), "application/json"),
  csvOpt: (ds) => { const b = $("#csv-broker"); if (b) S.ui.csv.broker = b.value; S.ui.csv[ds.k] = ds.v === "1"; renderScreen(); },
  csvImport: () => {
    const c = S.ui.csv, pv = csvPreview(); if (!pv || !pv.items.length) return;
    const broker = (($("#csv-broker") && $("#csv-broker").value) || c.broker || "").trim().slice(0, 60) || "未指定券商";
    const d = data();
    if (c.replace) d.holdings = d.holdings.filter((h) => (h.broker || "") !== broker);
    pv.items.forEach((it) => {
      const h = d.holdings.find((x) => x.symbol === it.symbol && (x.broker || "") === broker);
      if (h) { h.shares = it.shares; h.unitCost = it.unitCost; } else d.holdings.push(Object.assign({ id: uid(), broker, date: today() }, it));
      logTrade(d, "匯入", Object.assign({ broker }, it));
    });
    S.ui.csv = {}; commit(); toast(`已匯入 ${pv.items.length} 檔 ETF（${broker}）`);
  },
  importLog: () => { S.ui.tFilter = { sym: "", act: "匯入", broker: "" }; S.ui.hSection = 1; S.tab = 2; S.stacks[2] = []; renderScreen(); window.scrollTo(0, 0); },
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.dataset.act !== "backdrop") e.preventDefault();
  fn(el.dataset, el, e);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.sheet) closeSheet();
  if (e.key === "Enter" && e.target.id === "q") e.target.blur();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[role=button][data-act]")) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "q") {
    S.ui.q = t.value; S.ui.listMore = false; const list = $("#fund-list"); if (list) list.innerHTML = S.ui.dKind === 1 ? stockList() : fundList();
    const matches = $("#stock-matches"); if (matches) matches.innerHTML = stockMatches();
    return;
  }
  if (t.id === "hq") { S.ui.hq = t.value; const list = $("#hlist"); if (list) { const items = sortedHoldings(); list.innerHTML = items.length ? items.map(holdingRow).join("") : `<div class="card">${empty("🔍", "找不到符合的持有", "換個代號、名稱或券商試試。")}</div>`; } return; }
  if (t.closest("#plan-form")) return updatePlan();
  if (t.closest("#calc-form")) return updateCalc();
  if (t.closest("#goal-form")) return updateGoal();
  if (t.id === "h-symbol") { const f = secOf(t.value.trim().toUpperCase()); $("#h-fundname").textContent = f ? f.name : t.value.trim().length >= 4 ? "清單沒有這個代號" : ""; const w = $("#h-name-wrap"); if (w) w.hidden = !!f || t.value.trim().length < 4; }
  if (t.closest("#holding-form")) updateHoldingPreview();
  if (t.id === "cb-sp" || t.id === "cb-ep") { const v = Math.min(Math.max(Math.round(Number(t.value) || 0), 0), 100); const other = $(t.id === "cb-sp" ? "#cb-ep" : "#cb-sp"); if (other && t.value !== "") other.value = 100 - v; }
  if (t.id === "ci-sym") { const f = secOf(t.value.trim().toUpperCase()); $("#ci-name").textContent = f ? `${f.name}・${isStock(f.id) ? "個股" : "ETF"}` : ""; }
  if (t.id === "t-symbol") { const f = secOf(t.value.trim().toUpperCase()); $("#t-fundname").textContent = f ? f.name : ""; }
  if (t.closest("#div-form")) updateDivForm();
  if (t.id === "csv-broker" && S.ui.csv) S.ui.csv.broker = t.value;
});
document.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.id === "hsort") { S.ui.hSort = t.value; renderScreen(); }
  if (t.id === "s-ind") { S.ui.sInd = t.value; S.ui.listMore = false; renderScreen(); }
  if (/^cmp\d$/.test(t.id)) { if (!t.value) return; const d = data(); const syms = comparisonSymbols(d).slice(); syms[Number(t.dataset.i)] = t.value; d.comparison = [...new Set(syms)].slice(0, 3); commit(); }
  if (t.id === "tf-sym" || t.id === "tf-act" || t.id === "tf-broker") { S.ui.tFilter[{ "tf-sym": "sym", "tf-act": "act", "tf-broker": "broker" }[t.id]] = t.value; renderScreen(); }
  if (t.dataset && t.dataset.csvcol) { S.ui.csv.map[t.dataset.csvcol] = Number(t.value); renderScreen(); }
  if (t.closest && t.closest("#div-form")) updateDivForm();
  if (t.id === "import-file" && t.files && t.files[0]) { if (t.files[0].size > 5e6) { toast("檔案太大，請確認是這個網頁版的備份。"); return; } importJSON(await t.files[0].text()); }
  if (t.id === "csv-file" && t.files && t.files[0]) {
    const file = t.files[0];
    try {
      if (file.size > 3e6) throw new Error("檔案太大（超過 3 MB），請確認是庫存 CSV。");
      const rows = parseCSV(decodeCSV(await file.arrayBuffer()));
      const hi = rows.findIndex((r) => { const g = guessColumns(r); return g.sym >= 0 && g.shares >= 0; });
      if (hi < 0) throw new Error("找不到「代號」與「股數」欄位，請確認是券商的庫存明細 CSV。");
      const headers = rows[hi], g = guessColumns(headers), costHead = g.cost >= 0 ? headers[g.cost] : "";
      S.ui.csv = { file: file.name, headers, rows: rows.slice(hi + 1), map: { sym: g.sym, shares: g.shares, cost: g.cost >= 0 ? g.cost : g.shares, name: g.name }, lots: /張/.test(headers[g.shares]), totalCost: !/單價|均價|每股/.test(costHead), broker: S.ui.csv && S.ui.csv.broker || "", replace: true };
    } catch (err) { S.ui.csv = { error: err.message }; }
    renderScreen();
  }
});

/* ---------- boot ---------- */
S.ui.csv = {};
(function patchComparison() {
  const base = comparisonSymbols;
  comparisonSymbols = (d) => { const own = [...new Set((d.comparison || []).filter((s) => typeof s === "string"))].slice(0, 3); return own.length >= 2 ? own : base(d); };
})();
loadPrefs();
applyTheme();
loadMarket();
loadComps();
// Deep links for testing: #home, #discover, #holdings, #dividends, #tools, #detail-0050, or #tab/view[:id] such as #home/overview, #holdings/holding:<id>, #holdings@1.
(function applyHash() {
  const h = decodeURIComponent((location.hash || "").slice(1));
  if (/^detail-[0-9A-Z]{4,8}$/.test(h)) { S.tab = 1; S.stacks[1] = [{ view: "detail", sym: h.slice(7) }]; S.ui.detailRange = "當日"; return; }
  const m = /^(home|discover|holdings|dividends|tools)(?:@(\d))?(?:\/([a-zA-Z]+)(?::(.+))?)?$/.exec(h); if (!m) return;
  S.tab = TABS.findIndex((t) => t.key === m[1]);
  if (m[2]) { if (m[1] === "holdings") { const sub = ["", "trades", "alloc"][Number(m[2])]; if (sub) S.stacks[2] = [{ view: sub }]; } if (m[1] === "discover") S.ui.detail = Number(m[2]); }
  if (m[3] && VIEWS[m[3]]) { const p = m[4] || ""; S.stacks[S.tab] = [{ view: m[3], id: p, sym: p, ref: p }]; }
})();
if (/^stock-[0-9A-Z]{4,6}$/.test(decodeURIComponent((location.hash || "").slice(1)))) { const sym = decodeURIComponent(location.hash.slice(7)); S.tab = 1; S.stacks[1] = [{ view: "stock", sym }]; }
renderScreen();
// During trading hours, keep whole-market quotes fresh while the page is in front.
// Live data during trading hours; nothing streams or polls while the page is hidden.
setInterval(liveLoop, 2500);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") liveStop(); else liveResume(); });
window.addEventListener("pagehide", liveStop);
window.addEventListener("pageshow", (e) => { if (e.persisted) liveResume(); });
window.addEventListener("online", () => { if (!LIVE.ws) liveResume(); });
loadCatalog();
loadStocks();
initStore();
</script>
