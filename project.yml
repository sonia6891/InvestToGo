name: ETFToGo
options:
  bundleIdPrefix: tw.sonia
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    # The production id is the CI variable ETF_BUNDLE_ID; the widget is <id>.widget and the App Group group.<id> (§10.6).
    ETF_APP_BUNDLE_ID: tw.sonia.etftogo.uireview
    APP_GROUP_ID: group.$(ETF_APP_BUNDLE_ID)
# Crash and error reporting (Task 14). Pinned: the newest 8.x release at least two weeks old.
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 8.58.4
targets:
  ETFToGo:
    type: application
    platform: iOS
    dependencies:
      - package: Sentry
        product: Sentry
      # The 連續定投 widget, embedded in the app.
      - target: ETFToGoWidget
    # PocketCore's sources and data are compiled into the app; the same files form a SwiftPM package for Linux tests.
    sources:
      - App
      - WidgetShared
      - PocketCore/Sources/PocketCore
    # Skin fonts (App/Resources/Fonts, OFL licences beside them). XcodeGen writes this plist; Xcode merges it with
    # the generated Info.plist keys below.
    info:
      path: Support/ETFToGo-Info.plist
      properties:
        UIAppFonts:
          - Anton-Regular.ttf
          - PressStart2P-Regular.ttf
          - DotGothic16-Regular.ttf
          - BreeSerif-Regular.ttf
          - Caveat-Variable.ttf
          - NotoSansTC-Bold.ttf
          - NotoSansTC-Medium.ttf
          - NotoSerifTC-Bold.otf
          - NotoSerifTC-Medium.otf
          - LXGWWenKaiTC-Medium.ttf
          - JetBrainsMono-Regular.ttf
        # The launch screen is the default skin's page colour (blackgold #1A1A1D, App/Assets.xcassets/LaunchBackground),
        # not the generated white: a slow cold start never shows a blank white screen.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Sentry's DSN; empty in Debug (and so in CI, which builds Debug), the project DSN in Release.
        SentryDSN: '$(SENTRY_DSN)'
        # The App Group the widget's file lives in (WidgetFile); the unsigned simulator build may have no container.
        ETFAppGroup: '$(APP_GROUP_ID)'
        # The widget opens the lobby through etftogo://lobby (AppURL).
        CFBundleURLTypes:
          - CFBundleURLName: tw.sonia.etftogo
            CFBundleURLSchemes:
              - etftogo
        # 到價提醒 (PriceAlertMonitor): the background refresh task that checks prices when iOS allows it. The
        # identifier is the one the code registers; it does not have to match the bundle id.
        BGTaskSchedulerPermittedIdentifiers:
          - tw.sonia.etftogo.alerts
        UIBackgroundModes:
          - fetch
    entitlements:
      path: Support/ETFToGo.entitlements
      properties:
        com.apple.security.application-groups:
          - '$(APP_GROUP_ID)'
    settings:
      configs:
        # Written into project.pbxproj as a quoted string, not an .xcconfig, so the `//` is not a comment there.
        # CI checks the resolved Release value with -showBuildSettings.
        Debug:
          SENTRY_DSN: ''
        Release:
          SENTRY_DSN: 'https://879ab668f46097254e4b9af68234f109@o4512394043260928.ingest.us.sentry.io/4512422000197632'
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ETF_APP_BUNDLE_ID)
        # Empty by default (Automatic signing ignores it); the TestFlight run names the app's manual profile.
        PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE_SPECIFIER)
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 投資袋著走
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # App 上鎖 (2026-11-22 design): what iOS shows when it first asks to allow Face ID.
        INFOPLIST_KEY_NSFaceIDUsageDescription: 用 Face ID 解鎖投資袋著走
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # The 連續定投 widget (small and medium). It compiles PocketCore's sources for the streak rules and the skins, but not the
  # fund data (it never reads it); it reads only the amount-free widget.json in the App Group.
  ETFToGoWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - WidgetShared
      - App/Widget/AppURL.swift
      - path: PocketCore/Sources/PocketCore
        excludes:
          - Resources/catalog.json
          - Resources/annual-fees.json
          - Resources/official-dividends.json
    info:
      path: Support/ETFToGoWidget-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        ETFAppGroup: '$(APP_GROUP_ID)'
    entitlements:
      path: Support/ETFToGoWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - '$(APP_GROUP_ID)'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ETF_APP_BUNDLE_ID).widget
        # Empty by default (Automatic signing ignores it); the TestFlight run names the widget's manual profile.
        PROVISIONING_PROFILE_SPECIFIER: $(WIDGET_PROFILE_SPECIFIER)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 投資袋著走
        TARGETED_DEVICE_FAMILY: '1'
        APPLICATION_EXTENSION_API_ONLY: YES
  ETFToGoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ETFToGo
    settings:
      base:
        # `@testable import ETFToGo` loads Sentry's module; the test bundle finds it beside the app instead of linking
        # a second copy of the SDK.
        FRAMEWORK_SEARCH_PATHS: '$(inherited) $(BUILT_PRODUCTS_DIR) $(BUILT_PRODUCTS_DIR)/PackageFrameworks'
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1'
  ETFToGoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ETFToGo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1'
schemes:
  ETFToGo:
    build:
      targets:
        ETFToGo: all
    test:
      targets: [ETFToGoTests, ETFToGoUITests]
