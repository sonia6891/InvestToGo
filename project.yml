name: ETFToGo
options:
  bundleIdPrefix: tw.sonia
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.3.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  ETFToGo:
    type: application
    platform: iOS
    # PocketCore's sources and data are compiled into the app; the same files form a SwiftPM package for Linux tests.
    sources:
      - App
      - PocketCore/Sources/PocketCore
    # Skin fonts (App/Resources/Fonts, OFL licences beside them). XcodeGen writes this plist; Xcode merges it with
    # the generated Info.plist keys below.
    info:
      path: Support/ETFToGo-Info.plist
      properties:
        UIAppFonts:
          - Anton-Regular.ttf
          - PressStart2P-Regular.ttf
          - DotGothic16-Regular.ttf
          - BreeSerif-Regular.ttf
          - Caveat-Variable.ttf
          - NotoSansTC-Bold.ttf
          - NotoSansTC-Medium.ttf
          - NotoSerifTC-Bold.otf
          - NotoSerifTC-Medium.otf
          - LXGWWenKaiTC-Medium.ttf
          - JetBrainsMono-Regular.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.sonia.etftogo.uireview
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 投資袋著走
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ETFToGoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ETFToGo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1'
  ETFToGoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ETFToGo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1'
schemes:
  ETFToGo:
    build:
      targets:
        ETFToGo: all
    test:
      targets: [ETFToGoTests, ETFToGoUITests]
