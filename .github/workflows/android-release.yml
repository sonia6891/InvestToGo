name: Android release bundle
# Builds the signed AAB for Google Play (spec 9.1). Run by hand from the Actions tab; the upload key comes from the
# ETF_UPLOAD_* secrets, set once from the private key folder outside the repository. The AAB is uploaded to the
# closed track by hand in Play Console, after the owner says so.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure upload signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ETF_UPLOAD_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ETF_UPLOAD_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ETF_UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ETF_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEY_ALIAS" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/etf-upload.jks"
          {
            echo "ETF_UPLOAD_KEYSTORE=$RUNNER_TEMP/etf-upload.jks"
            echo "ETF_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "ETF_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "ETF_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
            # Play needs a larger code for every upload; seconds since 1970 always grow and stay under Play's limit.
            echo "ETF_VERSION_CODE=$(date -u +%s)"
          } >> "$GITHUB_ENV"
      - name: Tests, then the signed bundle
        working-directory: android
        run: ./gradlew :core:test :app:testDebugUnitTest :app:bundleRelease
      - name: Check the bundle is signed with the upload key
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | grep -q "jar verified"
      - uses: actions/upload-artifact@v4
        with:
          name: etftogo-google-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
