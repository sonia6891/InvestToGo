name: Android
# Every change to the Android code, the shared vectors or PocketCore runs both sides: Kotlin checks itself against the
# recorded vectors, and Swift checks the vectors still match PocketCore. Neither job writes anything back.
on:
  push:
    branches-ignore: [main]
    paths:
      - android/**
      - SharedFixtures/**
      - PocketCore/**
      - .github/workflows/android.yml
  pull_request:
    paths:
      - android/**
      - SharedFixtures/**
      - PocketCore/**
      - .github/workflows/android.yml
permissions:
  contents: read
jobs:
  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin core and app tests, debug build
        working-directory: android
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-report
          path: |
            android/core/build/reports/tests/test
            android/core/build/test-results/test
            android/app/build/reports/tests
            android/app/build/test-results
  swift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: PocketCore tests
        run: swift test --package-path PocketCore
