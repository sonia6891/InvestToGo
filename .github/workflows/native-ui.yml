name: Build and inspect native ETF UI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ui
  cancel-in-progress: false
jobs:
  core:
    # PocketCore's shared logic is tested on Linux first, so a failing change never takes Mac minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test PocketCore
        run: swift test --package-path PocketCore
      - name: Check the subset fonts cover the app's own text
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/fonts"
          "$RUNNER_TEMP/fonts/bin/pip" install --quiet fonttools==4.66.1
          "$RUNNER_TEMP/fonts/bin/python" Scripts/subset_fonts.py --check
  skin-matrix:
    # The four-skin screenshot matrix (Task 13): every skin × the screens on the design canvas, named
    # <skin>-<screen>.png, then one contact sheet laid out like the canvas. Its own job beside `simulator` so the
    # 44 launches never push that job past its limit.
    needs: core
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Generate complete Xcode project
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 26.6'
          brew install xcodegen
          xcodegen generate
      - name: Boot an available iPhone simulator
        id: device
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,items in d["devices"].items() if "iOS" in runtime for x in items if "iPhone" in x["name"]))')
          echo "udid=$DEVICE" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl ui "$DEVICE" appearance light
      - name: Compile native app
        env:
          DEVICE: ${{ steps.device.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p build/matrix
          xcodebuild build -project ETFToGo.xcodeproj -scheme ETFToGo -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/compile.log
      - name: Set up Pillow for the blank-frame check and the contact sheet
        run: |
          set -euo pipefail
          python3 -m venv build/venv
          build/venv/bin/pip install --quiet pillow==12.3.0
      - name: Capture four skins × eleven screens
        # No continue-on-error: fewer than 44 shots fails the job (the artifact is still published below).
        timeout-minutes: 20
        env:
          DEVICE: ${{ steps.device.outputs.udid }}
        run: |
          set -uo pipefail
          xcrun simctl install "$DEVICE" build/DerivedData/Build/Products/Debug-iphonesimulator/ETFToGo.app
          # A frame that is one flat colour below the status bar is the launch screen or a page still loading.
          blank() {
            build/venv/bin/python -c 'import sys; from PIL import Image, ImageStat; im = Image.open(sys.argv[1]).convert("L"); w, h = im.size; sys.exit(0 if ImageStat.Stat(im.crop((0, h // 8, w, h))).stddev[0] < 3 else 1)' "$1"
          }
          # screen id → launch arguments after --open (開機 引導1 大廳 找ETF 詳情 圖鑑卡 口袋 配息 工具 換膚 成就).
          SCREENS="splash onboarding lobby find detail dex pocket dividends tools skins achievements"
          # Rows in the global-constraints order, as the skinKit loop.
          for SKIN in blackgold voxel stitch sketch; do
            for SCREEN in $SCREENS; do
              case "$SCREEN" in
                onboarding) OPEN="onboarding --page 1"; NAME=onboarding1 ;;
                detail|dex) OPEN="$SCREEN --symbol 0050"; NAME=$SCREEN ;;
                *) OPEN="$SCREEN"; NAME=$SCREEN ;;
              esac
              OUT="build/matrix/$SKIN-$NAME.png"
              xcrun simctl terminate "$DEVICE" tw.sonia.etftogo.uireview || true
              # --reset each time: every shot starts from the same seeded state. --quiet-toasts: no first-time
              # notices (the first 詳情 visit's 「收進圖鑑 +30 經驗」) over the page.
              # shellcheck disable=SC2086
              xcrun simctl launch "$DEVICE" tw.sonia.etftogo.uireview --ui-testing --reset --quiet-toasts --skip-onboarding --demo-streak 12 --demo-level 7 --demo-pocket --skin "$SKIN" --open $OPEN || echo "::warning::launch failed for $SKIN-$NAME"
              sleep 5
              xcrun simctl io "$DEVICE" screenshot "$OUT" || echo "::warning::screenshot failed for $SKIN-$NAME"
              # Not settled yet (still the launch screen): wait and shoot again, twice at most.
              for RETRY in 1 2; do
                if [ -f "$OUT" ] && blank "$OUT"; then
                  echo "::warning::$SKIN-$NAME was a blank frame; retry $RETRY"
                  sleep 4
                  xcrun simctl io "$DEVICE" screenshot "$OUT" || true
                fi
              done
              if [ -f "$OUT" ] && blank "$OUT"; then echo "::error::$SKIN-$NAME is still blank"; fi
            done
          done
          COUNT=$(ls build/matrix/*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "captured $COUNT of 44"
          if [ "$COUNT" -ne 44 ]; then echo "::error::skin matrix has $COUNT of 44 shots"; exit 1; fi
      - name: Lay out the contact sheet
        if: always()
        run: build/venv/bin/python Scripts/contact_sheet.py build/matrix build/matrix/contact-sheet.png
      - name: Publish the skin matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ETFToGo-skin-matrix
          path: |
            build/matrix/
            build/compile.log
          retention-days: 14
  simulator:
    needs: core
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Generate complete Xcode project
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 26.6'
          brew install xcodegen
          xcodegen generate
          xcodebuild -list -project ETFToGo.xcodeproj
      - name: Boot an available iPhone simulator
        id: device
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,items in d["devices"].items() if "iOS" in runtime for x in items if "iPhone" in x["name"]))')
          echo "udid=$DEVICE" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl ui "$DEVICE" appearance light
      - name: Compile native app
        env:
          DEVICE: ${{ steps.device.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p build/screens
          xcodebuild build-for-testing -project ETFToGo.xcodeproj -scheme ETFToGo -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/compile.log
          python3 -c "import plistlib; from pathlib import Path; p=plistlib.loads(Path('build/DerivedData/Build/Products/Debug-iphonesimulator/ETFToGo.app/Info.plist').read_bytes()); assert p['UIDeviceFamily']==[1], p['UIDeviceFamily']; print('Verified iPhone-only simulator app')"
          # Sentry (Task 14): the Debug app CI runs carries an empty SentryDSN, so it sends nothing; the Release
          # setting resolves to the whole DSN (`//` and `@` intact).
          python3 -c "import plistlib; from pathlib import Path; p=plistlib.loads(Path('build/DerivedData/Build/Products/Debug-iphonesimulator/ETFToGo.app/Info.plist').read_bytes()); assert p.get('SentryDSN', None) == '', repr(p.get('SentryDSN', None)); print('Verified empty SentryDSN in Debug')"
          # -target, not -scheme (the two are exclusive): one target, so the first SENTRY_DSN line is the app's.
          xcodebuild -showBuildSettings -project ETFToGo.xcodeproj -target ETFToGo -configuration Release -sdk iphonesimulator > build/release-settings.txt
          RELEASE_DSN=$(sed -n 's/^ *SENTRY_DSN = //p' build/release-settings.txt | head -n 1)
          test "$RELEASE_DSN" = 'https://879ab668f46097254e4b9af68234f109@o4512394043260928.ingest.us.sentry.io/4512422000197632' || { echo "::error::Release SENTRY_DSN resolved to '$RELEASE_DSN'"; exit 1; }
          echo 'Verified full SENTRY_DSN in Release'
      - name: Capture the lobby and every feature screen
        timeout-minutes: 10
        continue-on-error: true
        env:
          DEVICE: ${{ steps.device.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl install "$DEVICE" build/DerivedData/Build/Products/Debug-iphonesimulator/ETFToGo.app
          for SCREEN in lobby find dividends pocket tools achievements member skins splash levelup; do
            xcrun simctl terminate "$DEVICE" tw.sonia.etftogo.uireview || true
            xcrun simctl launch "$DEVICE" tw.sonia.etftogo.uireview --ui-testing --skip-onboarding --demo-streak 12 --demo-level 7 --open "$SCREEN"
            sleep 5
            xcrun simctl io "$DEVICE" screenshot "build/screens/screen-$SCREEN.png"
          done
          # 換膚 worn in the light sketch skin, to check the carousel's frame and badges on paper.
          xcrun simctl terminate "$DEVICE" tw.sonia.etftogo.uireview || true
          xcrun simctl launch "$DEVICE" tw.sonia.etftogo.uireview --ui-testing --skip-onboarding --demo-level 7 --skin sketch --open skins
          sleep 5
          xcrun simctl io "$DEVICE" screenshot "build/screens/screen-skins-sketch.png"
          # 新手引導, each of its four pages (spec 5.2).
          for PAGE in 1 2 3 4; do
            xcrun simctl terminate "$DEVICE" tw.sonia.etftogo.uireview || true
            xcrun simctl launch "$DEVICE" tw.sonia.etftogo.uireview --ui-testing --open onboarding --page "$PAGE"
            sleep 4
            xcrun simctl io "$DEVICE" screenshot "build/screens/screen-onboarding-$PAGE.png"
          done
          # 離線中 (spec 9): the offline bar, and 找 ETF keeping its last list with 「再試一次」.
          xcrun simctl terminate "$DEVICE" tw.sonia.etftogo.uireview || true
          xcrun simctl launch "$DEVICE" tw.sonia.etftogo.uireview --ui-testing --skip-onboarding --offline --open find
          sleep 5
          xcrun simctl io "$DEVICE" screenshot "build/screens/screen-find-offline.png"
          # 減少動態效果 (spec 3.5): 配息 and the lobby as they look with --reduce-motion.
          for SCREEN in lobby dividends; do
            xcrun simctl terminate "$DEVICE" tw.sonia.etftogo.uireview || true
            xcrun simctl launch "$DEVICE" tw.sonia.etftogo.uireview --ui-testing --skip-onboarding --reduce-motion --demo-pocket --demo-streak 12 --open "$SCREEN"
            sleep 5
            xcrun simctl io "$DEVICE" screenshot "build/screens/screen-$SCREEN-reduce-motion.png"
          done
      - name: Capture the skin kit sheet in every skin
        timeout-minutes: 2
        continue-on-error: true
        env:
          DEVICE: ${{ steps.device.outputs.udid }}
        run: |
          set -euo pipefail
          for SKIN in blackgold voxel stitch sketch; do
            xcrun simctl terminate "$DEVICE" tw.sonia.etftogo.uireview || true
            xcrun simctl launch "$DEVICE" tw.sonia.etftogo.uireview --ui-testing --reset --skip-onboarding --skin "$SKIN" --open skinKit
            sleep 8
            xcrun simctl io "$DEVICE" screenshot "build/screens/skinkit-$SKIN.png"
          done
      - name: Publish screenshots immediately for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ETFToGo-screens
          path: build/screens/
          retention-days: 14
      - name: Verify calculations, persistence, search and editing
        env:
          DEVICE: ${{ steps.device.outputs.udid }}
        run: |
          set -euo pipefail
          xcodebuild test-without-building -project ETFToGo.xcodeproj -scheme ETFToGo -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/DerivedData -resultBundlePath build/Tests.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/tests.log
      - name: Export UI test screenshots
        if: always()
        run: |
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/test-attachments
          fi
      - name: Save verifiable build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ETFToGo-native-ui-evidence
          retention-days: 14
          path: |
            build/screens/
            build/test-attachments/
            build/*.log
            build/Tests.xcresult/
            ETFToGo.xcodeproj/
            App/Assets.xcassets/AppIcon.appiconset/AppIcon.png
