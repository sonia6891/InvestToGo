name: Build and inspect native ETF UI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ui
  cancel-in-progress: false
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate complete Xcode project
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 26.6'
          brew install xcodegen
          xcodegen generate
          xcodebuild -list -project ETFToGo.xcodeproj
      - name: Boot an available iPhone simulator
        id: device
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,items in d["devices"].items() if "iOS" in runtime for x in items if "iPhone" in x["name"]))')
          echo "udid=$DEVICE" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl ui "$DEVICE" appearance light
      - name: Compile native app
        env:
          DEVICE: ${{ steps.device.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p build/screens
          xcodebuild build-for-testing -project ETFToGo.xcodeproj -scheme ETFToGo -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/compile.log
          python3 -c "import plistlib; from pathlib import Path; p=plistlib.loads(Path('build/DerivedData/Build/Products/Debug-iphonesimulator/ETFToGo.app/Info.plist').read_bytes()); assert p['UIDeviceFamily']==[1], p['UIDeviceFamily']; print('Verified iPhone-only simulator app')"
      - name: Capture all five real SwiftUI screens
        timeout-minutes: 3
        continue-on-error: true
        env:
          DEVICE: ${{ steps.device.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl install "$DEVICE" build/DerivedData/Build/Products/Debug-iphonesimulator/ETFToGo.app
          for TAB in 0 1 2 3 4; do
            xcrun simctl terminate "$DEVICE" tw.sonia.etftogo.uireview || true
            xcrun simctl launch "$DEVICE" tw.sonia.etftogo.uireview --ui-testing --tab "$TAB"
            sleep 4
            xcrun simctl io "$DEVICE" screenshot "build/screens/screen-$TAB.png"
          done
      - name: Publish screenshots immediately for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ETFToGo-screens
          path: build/screens/
          retention-days: 14
      - name: Verify calculations, persistence, search and editing
        env:
          DEVICE: ${{ steps.device.outputs.udid }}
        run: |
          set -euo pipefail
          xcodebuild test-without-building -project ETFToGo.xcodeproj -scheme ETFToGo -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/DerivedData -resultBundlePath build/Tests.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/tests.log
      - name: Export UI test screenshots
        if: always()
        run: |
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/test-attachments
          fi
      - name: Save verifiable build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ETFToGo-native-ui-evidence
          retention-days: 14
          path: |
            build/screens/
            build/test-attachments/
            build/*.log
            build/Tests.xcresult/
            ETFToGo.xcodeproj/
            App/Assets.xcassets/AppIcon.appiconset/AppIcon.png
