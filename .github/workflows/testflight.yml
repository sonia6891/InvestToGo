name: Sign and upload native ETF app
# Needs only an App Store Connect API key with the Admin role (secrets APPLE_ASC_KEY_ID, APPLE_ASC_ISSUER_ID,
# APPLE_ASC_KEY_P8) and the variable ETF_BUNDLE_ID. Each run creates a temporary distribution certificate and
# App Store profiles through the API (Scripts/asc_signing.py) and removes them at the end, or, when the account's
# certificate limit is reached, signs in the cloud. Either way the App Group is checked in an exported IPA before the
# upload.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Build and upload a new build
        type: boolean
        default: true
      app_name:
        description: App name to set in App Store Connect (blank keeps it)
        required: false
        default: 投資袋著走
      build:
        description: Build number to hand to testers when not uploading (blank for the newest)
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: etftogo-testflight
  cancel-in-progress: false
jobs:
  prerequisites:
    runs-on: ubuntu-latest
    steps:
      - name: Require the App Store Connect API key and Bundle ID
        env:
          ETF_BUNDLE_ID: ${{ vars.ETF_BUNDLE_ID }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_KEY_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=0
          for name in ETF_BUNDLE_ID APPLE_ASC_KEY_ID APPLE_ASC_ISSUER_ID APPLE_ASC_KEY_P8; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing $name"; missing=1; fi
          done
          [[ "$missing" == 0 ]]
          [[ "$ETF_BUNDLE_ID" != "tw.sonia.etftogo.uireview" ]]
  upload:
    needs: prerequisites
    if: inputs.upload
    runs-on: macos-26
    timeout-minutes: 40
    env:
      ETF_BUNDLE_ID: ${{ vars.ETF_BUNDLE_ID }}
      APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
      APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate release project
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
      - name: Create temporary signing with the API key
        env:
          ASC_KEY_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/etf-signing"
          # The pasted key with or without its BEGIN/END lines.
          python3 - <<'PY'
          import os, pathlib, re
          text = os.environ["ASC_KEY_P8"].strip()
          body = re.sub(r"-----[A-Z ]+-----|\s", "", text)
          lines = [body[i:i + 64] for i in range(0, len(body), 64)]
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n"
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "etf-signing" / "AuthKey.p8").write_text(pem)
          PY
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet cryptography
          "$RUNNER_TEMP/asc-venv/bin/python" Scripts/asc_signing.py prepare
      - name: Install the temporary certificate
        if: env.SIGNING != 'cloud'
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/etf-signing/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/etf-signing/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution" || { echo "::error::The temporary certificate did not install"; exit 1; }
      - name: Archive signed iPhone app
        run: |
          set -euo pipefail
          mkdir -p build
          # Build numbers start at 3.x: builds uploaded before used 2.x for the same version.
          # Signed with the temporary certificate, or (cloud signing) built unsigned, signed ad hoc below, for the export to sign.
          if [[ "${SIGNING:-}" == "cloud" ]]; then
            SIGN=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          else
            SIGN=(CODE_SIGN_STYLE=Manual "CODE_SIGN_IDENTITY=Apple Distribution" "APP_PROFILE_SPECIFIER=$PROFILE_NAME" "WIDGET_PROFILE_SPECIFIER=$WIDGET_PROFILE_NAME")
          fi
          xcodebuild archive -project ETFToGo.xcodeproj -scheme ETFToGo -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/ETFToGo.xcarchive \
            "${SIGN[@]}" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" ETF_APP_BUNDLE_ID="$ETF_BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="3.$GITHUB_RUN_NUMBER" 2>&1 | tee build/archive.log
          APP_DIR=build/ETFToGo.xcarchive/Products/Applications/ETFToGo.app
          APPEX_DIR="$APP_DIR/PlugIns/ETFToGoWidget.appex"
          if [[ "${SIGNING:-}" == "cloud" ]]; then
            # An unsigned archive still carries each prebuilt framework's vendor signature (Sentry's), already broken
            # by the copy step's strip; the export would keep it and App Store Connect rejects it (error 90035).
            # Stripped of it, the frameworks are unsigned like the app, and the export signs them all.
            shopt -s nullglob
            for framework in "$APP_DIR"/Frameworks/*.framework; do
              codesign --remove-signature "$framework/$(basename "$framework" .framework)"
              rm -rf "$framework/_CodeSignature"
              echo "Removed the vendor signature from $(basename "$framework")"
            done
            # Unsigned binaries carry no entitlements, so the export would have no App Group to carry over and the
            # widget would never see the app's file. Ad hoc signatures hold it (the same keys as the generated
            # Support/*.entitlements); the export replaces every signature with the distribution one and keeps the
            # entitlements. Inside out: the frameworks (codesign seals nested code only when it is signed), then the
            # widget, then the app.
            "$RUNNER_TEMP/asc-venv/bin/python" Scripts/asc_signing.py entitlements
            ENTITLEMENTS="$RUNNER_TEMP/etf-signing/app-group.entitlements"
            for framework in "$APP_DIR"/Frameworks/*.framework; do
              codesign -f -s - "$framework"
            done
            codesign -f -s - --entitlements "$ENTITLEMENTS" "$APPEX_DIR"
            codesign -f -s - --entitlements "$ENTITLEMENTS" "$APP_DIR"
            echo "Signed the widget and the app ad hoc with group.$ETF_BUNDLE_ID for the export to carry"
          fi
          python3 -c "import plistlib; from pathlib import Path; p=plistlib.loads(Path('build/ETFToGo.xcarchive/Products/Applications/ETFToGo.app/Info.plist').read_bytes()); assert p['UIDeviceFamily']==[1], p['UIDeviceFamily']; print('Verified iPhone-only archive', p['CFBundleShortVersionString'], p['CFBundleVersion'])"
          # The 連續定投 widget rides in the app: <id>.widget, the app's build number, and the App Group in both.
          python3 - "$APP_DIR/Info.plist" "$APPEX_DIR/Info.plist" "$ETF_BUNDLE_ID" <<'PY'
          import plistlib, sys
          from pathlib import Path
          app, ext = (plistlib.loads(Path(p).read_bytes()) for p in sys.argv[1:3])
          assert ext['CFBundleIdentifier'] == sys.argv[3] + '.widget', ext['CFBundleIdentifier']
          assert ext['CFBundleVersion'] == app['CFBundleVersion'], (ext['CFBundleVersion'], app['CFBundleVersion'])
          print('Verified the widget extension', ext['CFBundleIdentifier'], ext['CFBundleVersion'])
          PY
          # Signed with the temporary certificate, or ad hoc above on the cloud path: either way both carry the group.
          for bundle in "$APP_DIR" "$APPEX_DIR"; do
            # Read whole first: with pipefail, grep -q closing the pipe early could fail a match.
            ENT=$(codesign -d --entitlements - --xml "$bundle" 2>/dev/null || true)
            grep -qF "group.$ETF_BUNDLE_ID" <<<"$ENT" || { echo "::error::$bundle lacks the App Group group.$ETF_BUNDLE_ID"; exit 1; }
            echo "Verified group.$ETF_BUNDLE_ID in the archived $(basename "$bundle")"
          done
      # What the upload would send, exported to a folder first: the App Group must be in the app and the widget as the
      # export signed them (in both signing modes), or the job stops here, before anything is uploaded.
      - name: Check the App Group in the exported IPA
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/asc-venv/bin/python" Scripts/asc_signing.py check-options
          xcodebuild -exportArchive -archivePath build/ETFToGo.xcarchive \
            -exportPath build/ipa-check -exportOptionsPlist "$RUNNER_TEMP/etf-signing/ExportOptions-check.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/etf-signing/AuthKey.p8" \
            -authenticationKeyID "$APPLE_ASC_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_ASC_ISSUER_ID" 2>&1 | tee build/ipa-check.log
          shopt -s nullglob
          IPAS=(build/ipa-check/*.ipa)
          [[ ${#IPAS[@]} == 1 ]] || { echo "::error::The local export made ${#IPAS[@]} IPAs, not one"; exit 1; }
          rm -rf build/ipa-check/unzipped
          unzip -q "${IPAS[0]}" -d build/ipa-check/unzipped
          APP=build/ipa-check/unzipped/Payload/ETFToGo.app
          APPEX="$APP/PlugIns/ETFToGoWidget.appex"
          for bundle in "$APP" "$APPEX"; do
            test -d "$bundle" || { echo "::error::The IPA has no $(basename "$bundle")"; exit 1; }
            ENT=$(codesign -d --entitlements - --xml "$bundle" 2>/dev/null || true)
            grep -qF "group.$ETF_BUNDLE_ID" <<<"$ENT" || { echo "::error::The exported $(basename "$bundle") lacks the App Group group.$ETF_BUNDLE_ID"; exit 1; }
            echo "Verified group.$ETF_BUNDLE_ID in the exported $(basename "$bundle")"
          done
          # No ad hoc signature may survive the export (the cloud path signs ad hoc before it), and the whole app verifies.
          for code in "$APP" "$APPEX" "$APP"/Frameworks/*.framework; do
            INFO=$(codesign -dv "$code" 2>&1 || true)
            if grep -qF "Signature=adhoc" <<<"$INFO"; then echo "::error::The exported $(basename "$code") is still signed ad hoc"; exit 1; fi
          done
          codesign --verify --deep "$APP" || { echo "::error::The exported app does not verify"; exit 1; }
          echo "Verified the exported IPA: the App Group in the app and the widget, and no ad hoc signature" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload archive to App Store Connect
        run: |
          set -euo pipefail
          xcodebuild -exportArchive -archivePath build/ETFToGo.xcarchive \
            -exportPath build/export -exportOptionsPlist "$RUNNER_TEMP/etf-signing/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/etf-signing/AuthKey.p8" \
            -authenticationKeyID "$APPLE_ASC_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_ASC_ISSUER_ID" 2>&1 | tee build/upload.log
          echo "Uploaded build 3.$GITHUB_RUN_NUMBER. App Store Connect processing and tester availability still require verification." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ETFToGo-release-logs
          path: build/*.log
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/etf-signing/build.keychain-db" || true
          if [[ -n "${PROFILE_UUID:-}" ]]; then rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"; fi
          if [[ -n "${WIDGET_PROFILE_UUID:-}" ]]; then rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$WIDGET_PROFILE_UUID.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$WIDGET_PROFILE_UUID.mobileprovision"; fi
          if [[ -x "$RUNNER_TEMP/asc-venv/bin/python" && -f "$RUNNER_TEMP/etf-signing/AuthKey.p8" ]]; then "$RUNNER_TEMP/asc-venv/bin/python" Scripts/asc_signing.py cleanup || true; fi
          rm -rf "$RUNNER_TEMP/etf-signing"
  # Renames the app in App Store Connect, waits for the newest build to finish processing and gives it to the
  # internal TestFlight testers (Scripts/asc_app.py), with the same API key.
  app:
    needs: [prerequisites, upload]
    if: always() && needs.prerequisites.result == 'success' && (needs.upload.result == 'success' || needs.upload.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ETF_BUNDLE_ID: ${{ vars.ETF_BUNDLE_ID }}
      ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the API key
        env:
          ASC_KEY_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/etf-signing"
          python3 - <<'PY'
          import os, pathlib, re
          body = re.sub(r"-----[A-Z ]+-----|\s", "", os.environ["ASC_KEY_P8"].strip())
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(body[i:i + 64] for i in range(0, len(body), 64)) + "\n-----END PRIVATE KEY-----\n"
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "etf-signing" / "AuthKey.p8").write_text(pem)
          PY
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet cryptography
      - name: Rename the app
        if: inputs.app_name != ''
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: '"$RUNNER_TEMP/asc-venv/bin/python" Scripts/asc_app.py rename "$APP_NAME"'
      - name: List the team's distribution certificates
        run: '"$RUNNER_TEMP/asc-venv/bin/python" Scripts/asc_app.py certificates'
      - name: Wait for the build and give it to internal testers
        env:
          BUILD: ${{ needs.upload.result == 'success' && format('3.{0}', github.run_number) || inputs.build }}
        run: '"$RUNNER_TEMP/asc-venv/bin/python" Scripts/asc_app.py testflight "$BUILD"'
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/etf-signing"
