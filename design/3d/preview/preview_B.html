<!doctype html><html><head><meta charset='utf-8'>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=JetBrains+Mono:wght@500;700&amp;family=Noto+Sans+TC:wght@500;700;900&amp;display=swap">
<style>
body{margin:0}
.ph{width:390px;height:844px;border-radius:46px;overflow:hidden;position:relative;background:#1A1A1D;color:#F4F1E8;font-family:'Noto Sans TC',sans-serif;box-shadow:0 24px 60px rgba(0,0,0,.28);flex:none}
.mono{font-family:'JetBrains Mono',monospace}
.col{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.hexo{display:inline-block;padding:1.5px;background:#F4F1E8;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%)}
.hexo span{display:block;background:#111114;color:#F4F1E8;clip-path:polygon(11px 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,11px 100%,0 50%)}
.tag span{padding:3px 16px;font-size:11px;font-weight:700;letter-spacing:.1em}
.btn{border:0;background:none;padding:0;cursor:pointer;font:inherit}
.btn .hexo{padding:2px}
.btn .hexo span{padding:12px 34px;font-size:16px;font-weight:900;letter-spacing:.12em}
.ck{width:26px;height:26px;border-radius:50%;background:#F4F1E8;display:flex;align-items:center;justify-content:center}
.ck.off{background:transparent;box-shadow:inset 0 0 0 2px #4A4A52}
.wk{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;color:#A9A397}
.tb{position:absolute;left:0;right:0;bottom:0;height:78px;padding-bottom:18px;box-sizing:border-box;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #26262C}
.ti{display:flex;flex-direction:column;align-items:center;gap:4px;color:#6E6A63;font-size:10px;font-weight:700;background:none;border:0;font-family:inherit;min-width:48px;min-height:44px;justify-content:center}
.ti.on{color:#F2B632}
</style>
